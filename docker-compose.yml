services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.example
    environment:
      SIDEKICKS_BACKEND: postgres
      DATABASE_URL: postgresql://sidekicks:sidekicks@postgres:5432/sidekicks
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: sidekicks-artifacts
      CONTROL_PLANE_ROLE: control-node
      RUNTIME_NODE_ENDPOINT: http://runtime-node:4001
      DEPLOY_QUEUE: sidekicks-deployments
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - minio
      - runtime-node
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.example
    environment:
      SIDEKICKS_BACKEND: postgres
      DATABASE_URL: postgresql://sidekicks:sidekicks@postgres:5432/sidekicks
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: sidekicks-artifacts
      CONTROL_PLANE_URL: http://web:3000
      WORKER_QUEUE: sidekicks-runs
      WORKER_RUNTIME: node
      RUNTIME_NODE_ENDPOINT: http://runtime-node:4001
      DEPLOY_QUEUE: sidekicks-deployments
    depends_on:
      - postgres
      - redis
      - minio
      - web
      - runtime-node
    restart: unless-stopped

  deployer:
    build:
      context: .
      dockerfile: Dockerfile.deployer
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://sidekicks:sidekicks@postgres:5432/sidekicks
      REDIS_URL: redis://redis:6379
      DEPLOY_QUEUE: sidekicks-deployments
      DOCKER_NETWORK: sidekicks_default
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - ${HOME}/.docker/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
      - runtime-openclaw-template
      - runtime-nanoclaw-template
    restart: unless-stopped

  runtime-node:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: sidekicks-runtime-node:latest
    environment:
      PORT: 4001
      RUNTIME_TEMPLATE_ID: tpl_appclaw
      RUNTIME_NAME: AppClaw
    restart: unless-stopped

  runtime-openclaw-template:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: sidekicks-runtime-openclaw:latest
    environment:
      PORT: 4001
      RUNTIME_TEMPLATE_ID: tpl_openclaw
      RUNTIME_NAME: OpenClaw
    restart: unless-stopped

  runtime-nanoclaw-template:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: sidekicks-runtime-nanoclaw:latest
    environment:
      PORT: 4001
      RUNTIME_TEMPLATE_ID: tpl_nanoclaw
      RUNTIME_NAME: NanoClaw
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sidekicks
      POSTGRES_USER: sidekicks
      POSTGRES_PASSWORD: sidekicks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sidekicks
      MINIO_ROOT_PASSWORD: sidekickspassword
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
